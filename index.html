<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silvia Jerielle Carraro | Massaggi Olistici a Oriago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
--sage:#B2AC88;
--sage-light:#E4E2D6;
--cream:#F8F6F0;
--cream-deep:#F1EEE4;
--moss:#4A5240;
--moss-soft:#6E7560;
--taupe:#9C9377;
--ink:#3A3F32;
--white:#FFFFFF;
--maxw:1140px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
font-family:'Inter',sans-serif;
color:var(--ink);
background:var(--cream);
font-weight:300;
line-height:1.7;
-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
font-family:'Cormorant Garamond',serif;
font-weight:600;
color:var(--moss);
letter-spacing:0.02em;
}
.container{max-width:var(--maxw);margin:0 auto;padding:0 32px;}
a{text-decoration:none;color:inherit;}

/* ===== NAV ===== */
header{
position:sticky;top:0;z-index:50;
background:rgba(248,246,240,0.95);
backdrop-filter:blur(8px);
border-bottom:1px solid var(--sage-light);
}
nav{
display:flex;justify-content:space-between;align-items:center;
padding:18px 32px;max-width:var(--maxw);margin:0 auto;
}
.logo{
font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;
color:var(--moss);display:flex;align-items:center;
letter-spacing:0.03em;
}
.logo-img { max-height: 40px; }

nav ul{display:flex;gap:36px;list-style:none;}
nav ul a{font-size:14px;color:var(--moss-soft);transition:color .2s;letter-spacing:.02em;}
nav ul a:hover{color:var(--moss);}
.nav-cta{
display:flex;align-items:center;gap:8px;
background:var(--moss);color:var(--cream);
padding:10px 22px;border-radius:30px;font-size:14px;font-weight:500;
transition:background .2s;
}
.nav-cta:hover{background:#3a4032;}
@media(max-width:780px){
nav ul{display:none;}
}

/* ===== HERO ===== */
.hero{
position:relative;
padding:90px 32px 110px;
background:linear-gradient(180deg,var(--cream) 0%,var(--cream-deep) 100%);
}
.hero-inner{
max-width:var(--maxw);margin:0 auto;
display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:center;
}
.hero-eyebrow{
font-size:13px;letter-spacing:.18em;text-transform:uppercase;
color:var(--taupe);font-weight:500;margin-bottom:18px;
display:flex;align-items:center;gap:10px;
}
.hero-eyebrow::before{
content:'';display:inline-block;width:28px;height:1px;background:var(--taupe);
}
.hero h1{
font-size:clamp(42px,5.5vw,64px);
line-height:1.1;margin-bottom:22px;
font-style:italic;font-weight:500;
}
.hero h1 strong{font-style:normal;font-weight:700;}
.hero p{
font-size:17px;color:var(--moss-soft);max-width:460px;margin-bottom:32px;
}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.btn-primary{
display:inline-flex;align-items:center;gap:10px;
background:var(--moss);color:var(--cream);
padding:16px 32px;border-radius:30px;font-size:15px;font-weight:500;
transition:transform .2s,background .2s;
}
.btn-primary:hover{background:#3a4032;transform:translateY(-2px);}
.btn-secondary{
display:inline-flex;align-items:center;gap:8px;
color:var(--moss);font-size:15px;font-weight:500;
padding:16px 8px;border-bottom:1px solid var(--sage);
transition:border-color .2s;
}
.btn-secondary:hover{border-color:var(--moss);}
.hero-visual{
position:relative;border-radius:24px;overflow:hidden;
aspect-ratio:4/5;background:var(--sage-light);
box-shadow:0 30px 60px -30px rgba(74,82,64,.35);
}
.hero-visual img{width:100%;height:100%;object-fit:cover;display:block;}
.hero-visual-tag{
position:absolute;bottom:22px;left:22px;
background:rgba(248,246,240,.95);backdrop-filter:blur(6px);
padding:12px 18px;border-radius:14px;
font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;color:var(--moss);
display:flex;align-items:center;gap:10px;
}
.leaf-dot{width:8px;height:8px;border-radius:50%;background:var(--sage);flex-shrink:0;}

/* ===== SECTION SHARED ===== */
section{padding:90px 32px;}
.section-head{
text-align:center;max-width:620px;margin:0 auto 56px;
}
.section-eyebrow{
font-size:13px;letter-spacing:.18em;text-transform:uppercase;
color:var(--taupe);font-weight:500;margin-bottom:14px;
}
.section-head h2{font-size:clamp(32px,4vw,46px);line-height:1.2;}
.section-head p{color:var(--moss-soft);font-size:16px;margin-top:14px;}

/* divider con linea */
.divider{
display:flex;align-items:center;justify-content:center;
margin:0 auto 12px;
}
.divider .line{height:1px;width:50px;background:var(--sage);}

/* ===== CHI SONO ===== */
.about{background:var(--white);}
.about-inner{
display:grid;grid-template-columns:0.9fr 1.1fr;gap:64px;align-items:center;
max-width:var(--maxw);margin:0 auto;
}
.about-img{
border-radius:20px;overflow:hidden;aspect-ratio:1/1.05;
background:var(--sage-light);
}
.about-img img{width:100%;height:100%;object-fit:cover;display:block;}
.about-text h2{font-size:clamp(30px,3.8vw,42px);margin-bottom:20px;line-height:1.2;}
.about-text p{color:var(--moss-soft);font-size:16px;margin-bottom:16px;}

.about-quote{
font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--moss);
font-size:clamp(15px, 2.2vw, 24px);
white-space:nowrap;
line-height:1.6;margin:26px 0;
padding-left:20px;border-left:2px solid var(--sage);
overflow:hidden; text-overflow:ellipsis;
}

.about-tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;}
.tag{
font-size:13px;color:var(--moss);background:var(--cream-deep);
padding:8px 16px;border-radius:20px;border:1px solid var(--sage-light);
}
@media(max-width:880px){
.about-inner,.hero-inner{grid-template-columns:1fr;}
.hero-visual{order:-1;max-width:420px;margin:0 auto;}
.about-quote { white-space: normal; }
}

/* ===== TREATMENTS ===== */
.treatments{background:var(--cream-deep);}
.treat-grid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:24px;max-width:var(--maxw);margin:0 auto;
align-items: start;
}
.treat-card{
background:var(--white);border-radius:18px;padding:32px 28px;
border:1px solid var(--sage-light);
transition:transform .25s,box-shadow .25s;
}
.treat-card:hover{
transform:translateY(-4px);
box-shadow:0 20px 40px -28px rgba(74,82,64,.35);
}
.treat-card-head{
margin-bottom:12px;
}
.treat-card-head h3, .tech-row h3, .ritual-card h3{
font-size:24px;
font-weight:700;
margin-bottom:6px;
white-space:nowrap;
}
.treat-price{
font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--moss);font-weight:600;
}
.treat-price small{font-size:13px;color:var(--taupe);font-family:'Inter',sans-serif;font-weight:400;}
.treat-card p{font-size:15px;color:var(--moss-soft);}

/* ===== TECHNICAL ===== */
.technical{background:var(--white);}
.tech-list{
max-width:850px;margin:0 auto;
border-top:1px solid var(--sage-light);
}
.tech-row{
display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;
padding:24px 8px;border-bottom:1px solid var(--sage-light);
}
.tech-row p{font-size:14px;color:var(--moss-soft);margin-top:4px;}
.tech-price{
font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--moss);text-align:right;
min-width:80px;white-space:nowrap;
}
@media(max-width:600px){
.tech-row{grid-template-columns:1fr;gap:8px;}
.tech-price{text-align:left;}
.treat-card-head h3, .tech-row h3, .ritual-card h3{
font-size: clamp(18px, 4.5vw, 24px);
}
}

/* ===== RITUALS ===== */
.rituals{background:var(--moss);color:var(--cream);}
.rituals .section-eyebrow{color:var(--sage-light);}
.rituals .section-head h2{color:var(--cream);}
.rituals .section-head p{color:#C9CDBC;}
.ritual-grid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:28px;max-width:var(--maxw);margin:0 auto;
align-items: start;
}
.ritual-card{
background:rgba(248,246,240,0.06);
border:1px solid rgba(248,246,240,0.18);
border-radius:20px;padding:38px 32px;
}
.ritual-card h3{color:var(--cream);font-style:italic;}
.ritual-card p{color:#C9CDBC;font-size:15px;}
.ritual-price{
margin-top:18px;font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--sage-light);
}

/* ===== STUDIO / FOOTER ===== */
.studio{background:var(--cream-deep);}
.studio-inner{
display:grid;grid-template-columns:1fr 1fr;gap:0;
max-width:var(--maxw);margin:0 auto;
border-radius:24px;overflow:hidden;background:var(--white);
box-shadow:0 30px 70px -40px rgba(74,82,64,.3);
}
.studio-content{padding:60px;}
.studio-content h2{font-size:clamp(28px,3.5vw,38px);margin-bottom:18px;}
.studio-content p{color:var(--moss-soft);font-size:16px;margin-bottom:24px;}
.studio-info{display:flex;flex-direction:column;gap:16px;margin-bottom:32px;}
.studio-info-row{display:flex;align-items:center;gap:14px;font-size:15px;color:var(--moss);}
.icon-circle{
width:38px;height:38px;border-radius:50%;background:var(--sage-light);
display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.social-links{
display:flex;gap:12px;margin-top:24px;
}
.social-links a{
display:inline-flex;align-items:center;justify-content:center;
width:42px;height:42px;border-radius:50%;background:var(--cream-deep);
color:var(--moss);transition:background .2s, color .2s;
}
.social-links a:hover{background:var(--moss);color:var(--cream);}

.studio-map{min-height:340px;position:relative;}
.studio-map iframe{width:100%;height:100%;border:0;display:block;filter:saturate(0.85);}
@media(max-width:880px){
.studio-inner{grid-template-columns:1fr;}
.studio-map{min-height:280px;}
.studio-content{padding:44px 32px;}
}

/* ===== FINAL CTA ===== */
.final-cta{
text-align:center;background:var(--cream);padding-bottom:130px;
}
.final-cta h2{font-size:clamp(32px,4.5vw,48px);font-style:italic;margin-bottom:18px;}
.final-cta p{color:var(--moss-soft);font-size:16px;max-width:480px;margin:0 auto 36px;}

footer{
background:var(--moss);color:#C9CDBC;text-align:center;padding:40px 32px;font-size:14px;
}
footer a{color:var(--sage-light);font-weight:500;text-decoration:none;transition:color 0.2s;}
footer a:hover{color:var(--white);}
.footer-links{
display:flex;justify-content:center;gap:24px;margin-bottom:16px;flex-wrap:wrap;
}

@media(max-width:600px){
section{padding:64px 24px;}
.hero{padding:64px 24px 80px;}
nav{padding:14px 20px;}
}
</style>
</head>
<body>
